<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>micro-monban</title>
<!--
  micro-monban 本体画面（v1.13.0）
  ・kiosk.py が 127.0.0.1 だけで配る。Chromium のキオスク表示で開く
  ・?demo を付けるか、ファイルとして直接開くと、架空のデータで動く見本になる
  Copyright 2026 AiLab-Japan / Apache License 2.0
-->
<style>
:root{--bg:#f4f3ef;--card:#ffffff;--soft:#eceae4;--line:#d6d3ca;--tx:#1f1e1c;--tx2:#5c5a55;--tx3:#8a877f;
--ok:#2f6b12;--okbg:#e4f0d6;--wn:#7a4a06;--wnbg:#fbeccc;--ng:#8f2424;--ngbg:#fbe2e2;--ac:#185fa5;--acbg:#e3eefa;--on:#3b8a1a}
@media (prefers-color-scheme: dark){:root{--bg:#1b1b1a;--card:#262624;--soft:#30302d;--line:#45443f;--tx:#f1efe8;--tx2:#c2c0b6;--tx3:#8f8d85;
--ok:#b6dc8c;--okbg:#27400f;--wn:#f6c977;--wnbg:#4a3207;--ng:#f2a3a3;--ngbg:#561a1a;--ac:#9cc6f2;--acbg:#123555;--on:#5aa632}}
*{box-sizing:border-box}
html{font-size:max(13px,min(2vw,3.2vh))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans CJK JP","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;font-size:1rem;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:2.6rem;padding:0 1rem;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.dan{color:var(--ng);border-color:var(--ng)}
input{font:inherit;font-size:1.05rem;width:100%;min-height:2.6rem;padding:0 .8rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:.85rem;color:var(--tx2);margin:.5rem 0 .2rem}
header{display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem;border-bottom:1px solid var(--line);background:var(--card);min-height:3.2rem}
header .t{font-weight:600;font-size:1.05rem}
header .s{color:var(--tx2);font-size:.9rem}
main{flex:1;overflow:auto;padding:.8rem}
.pill{display:inline-block;font-size:.78rem;padding:.15rem .6rem;border-radius:8px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.wn{background:var(--wnbg);color:var(--wn)}.ng{background:var(--ngbg);color:var(--ng)}.ac{background:var(--acbg);color:var(--ac)}
.band{display:flex;align-items:center;gap:.9rem;border-radius:12px;padding:.8rem 1rem;margin-bottom:.7rem}
.band .h{font-size:1.25rem;font-weight:600}.band .m{font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:.7rem}
.met{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem}
.met .l{font-size:.78rem;color:var(--tx2)}.met .v{font-size:1.6rem;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem}
.sec{font-size:.8rem;color:var(--tx2);margin:.2rem 0 .3rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;min-height:2.5rem;border-bottom:1px solid var(--line);font-size:.95rem}
.row small{color:var(--tx2);font-size:.78rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:6.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;cursor:pointer;text-align:center;padding:.4rem}
.tile:active{transform:scale(.97)}.tile svg{width:1.8rem;height:1.8rem;stroke:var(--tx2)}.tile small{color:var(--tx2);font-size:.75rem}
.sw{width:3.4rem;height:1.95rem;border-radius:1rem;background:var(--line);position:relative;cursor:pointer;flex:none;border:none;padding:0;min-height:0}
.sw.on{background:var(--on)}.sw::after{content:"";position:absolute;top:.22rem;left:.22rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:left .15s}.sw.on::after{left:1.68rem}
.narrow{max-width:30rem;margin:0 auto}
.msg{min-height:1.3rem;font-size:.85rem;margin:.3rem 0}.msg.e{color:var(--ng)}.msg.g{color:var(--ok)}
.btns{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.over{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
.dlg{background:var(--card);border-radius:14px;padding:1.1rem 1.3rem;max-width:26rem;text-align:center}
.dlg .h{font-size:1.15rem;font-weight:600;margin-bottom:.3rem}
#kb{background:var(--soft);border-top:1px solid var(--line);padding:.35rem;display:none}
#kb .r{display:flex;gap:.25rem;margin-bottom:.25rem;justify-content:center}
#kb button{min-height:2.05rem;padding:0;flex:1;max-width:4.2rem;font-size:1rem;border-radius:8px}
#kb button.go{background:var(--ac);color:#fff;border-color:var(--ac)}
#kb button.w{max-width:7rem;flex:1.6}
.log{font-family:monospace;font-size:.78rem;background:var(--soft);border-radius:8px;padding:.5rem;max-height:14rem;overflow:auto;white-space:pre-wrap;user-select:text}
.steps{display:flex;gap:.3rem;margin:.3rem 0 .8rem}.steps div{flex:1;height:.3rem;border-radius:.2rem;background:var(--line)}.steps div.d{background:var(--on)}
.demo{position:fixed;left:50%;transform:translateX(-50%);top:.2rem;font-size:.7rem;opacity:.85;z-index:30;pointer-events:none}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="戻る" style="visibility:hidden">←</button>
  <span class="t">micro-monban</span><span class="s" id="title">ダッシュボード</span>
  <span style="margin-left:auto" class="s" id="clock"></span>
  <span id="lockinfo"></span>
  <button id="setbtn">設定</button>
</header>
<main id="main"></main>
<div id="kb"></div>
<div id="overlay"></div>
<script>
"use strict";
const DEMO = location.protocol === "file:" || /[?&]demo/.test(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let fromWz = false, S = null, view = "dash", authed = false, mustChange = false, wz = 0, wifiList = null, wifiTarget = "", flash = {}, dlg = null, lastTouch = Date.now();
const IDLE = 300;

/* ---------- 見本用の架空データ ---------- */
const D = {pw: "demo-pass-01", must: true, sess: false, sw: {pii: true, monitor_only: false, mgmt: false, breaker: false},
  blocked: ["203.0.113.8", "198.51.100.20", "192.0.2.44"], mail: {enabled: false, to: "", host: "", port: 587, user: "", configured: false, last: ""},
  ssid: "office-net", pend: null, job: {running: false, lines: [], ok: null}};
function demoState() {
  const lvl = D.sw.breaker ? "ng" : (!D.sw.pii ? "warn" : "ok");
  const nw = new Date(), p2 = x => String(x).padStart(2, "0");
  return {version: "v1.13.0（見本）", time: nw.getFullYear() + "-" + p2(nw.getMonth() + 1) + "-" + p2(nw.getDate()) + " " + p2(nw.getHours()) + ":" + p2(nw.getMinutes()), hostname: "monban-01", level: lvl,
    headline: {ok: "守りは正常に働いています", warn: "確認が必要なことがあります", ng: "すぐに確認してください"}[lvl],
    messages: D.sw.breaker ? ["緊急ブレーカーが作動中です（外部からの通信を止めています）"] : (!D.sw.pii ? ["個人情報ガードが止まっています"] : []),
    checked: "10:20:00", integrity: "ok", services: {nginx: true, nftables: true, dashboard: true, piiguard: D.sw.pii},
    backend: {ok: true, addr: "10.0.0.2:8080"}, counts: {requests: 1284, denied: 37, blocked_now: D.blocked.length, pii_today: 0, dlp_rules: 12},
    blocked: D.blocked, events: [{time: "10:12", text: "短時間に大量のアクセス", ip: "203.0.113.8", kind: "alert"}, {time: "09:48", text: "SQL インジェクションの疑い", ip: "198.51.100.20", kind: "alert"}],
    net: {ext_if: "wlan0", ext_ip: "192.168.1.175", ssid: D.ssid, int_ip: "10.0.0.1", home_net: "192.168.1.0/24"},
    switches: D.sw, mail: D.mail, uptime: "up 3 days", temp: "48.2", job: D.job, authed: D.sess,
    idle_left: D.sess ? Math.max(0, IDLE - Math.floor((Date.now() - lastTouch) / 1000)) : 0,
    pending: D.pend ? {kind: D.pend.kind, remaining: Math.max(0, Math.ceil((D.pend.until - Date.now()) / 1000)), result: ""} : null};
}
async function demoPost(p, b) {
  await new Promise(r => setTimeout(r, 250));
  if (p === "/api/login") { if (b.password && b.password.length) { D.sess = true; return {ok: true, must_change: D.must}; } return {ok: false, msg: "パスワードが違います"}; }
  if (!D.sess) return {ok: false, msg: "ロックされました", _401: true};
  if (p === "/api/logout") { D.sess = false; return {ok: true}; }
  if (p === "/api/password") { if ((b.new || "").length < 10) return {ok: false, msg: "10文字以上にしてください"}; D.must = false; return {ok: true, msg: "パスワードを変更しました"}; }
  if (D.must) return {ok: false, msg: "先に新しいパスワードを決めてください"};
  if (p === "/api/switch") { D.sw[b.name] = !!b.value; return {ok: true}; }
  if (p === "/api/unblock") { D.blocked = b.all ? [] : D.blocked.filter(x => x !== b.ip); return {ok: true, msg: "解除しました"}; }
  if (p === "/api/wifi/scan") return {ok: true, list: [{ssid: D.ssid, signal: 82, secure: true, in_use: true}, {ssid: "guest-wifi", signal: 61, secure: true, in_use: false}, {ssid: "shop-ap", signal: 35, secure: true, in_use: false}]};
  if (p === "/api/wifi/connect") { if (b.password && b.password.length < 8) return {ok: false, msg: "Wi-Fi のパスワードは 8〜63 文字です"}; const old = D.ssid; D.ssid = b.ssid; D.pend = {kind: "wifi", until: Date.now() + 60000, old}; return {ok: true, msg: b.ssid + " に接続しました", confirm_sec: 60}; }
  if (p === "/api/confirm") { D.pend = null; return {ok: true}; }
  if (p === "/api/mail") { Object.assign(D.mail, b); D.mail.configured = !!(D.mail.host && D.mail.to); return {ok: true, msg: "保存しました"}; }
  if (p === "/api/mail/test") return {ok: D.mail.configured, msg: D.mail.configured ? "テストメールを送信しました。" : "SMTPホストと宛先を入力して保存してから試験してください"};
  if (p === "/api/report/send") return {ok: true, msg: "設定レポートを送りました（見本）"};
  if (p === "/api/backend/test") return {ok: true, msg: "応答あり"};
  if (p === "/api/selftest") { D.job = {running: true, lines: ["== サービス", "  [OK] nginx が動いている"], ok: null}; setTimeout(() => { D.job = {running: false, lines: ["== サービス", "  [OK] nginx が動いている", "  [OK] nftables が動いている", "== 結果: OK 25 / NG 0 / 省略 0"], ok: true, done_at: "10:30"}; }, 3000); return {ok: true}; }
  if (p === "/api/system") return {ok: true, msg: "見本なので実際には" + (b.action === "reboot" ? "再起動" : "停止") + "しません"};
  if (p === "/api/ping") return {ok: true};
  return {ok: false, msg: "見本では使えません"};
}
setInterval(() => { if (D.pend && Date.now() > D.pend.until) { D.ssid = D.pend.old; D.pend = null; flash.wifi = ["確認がなかったので元に戻しました", false]; } }, 500);

/* ---------- 通信 ---------- */
async function getState() {
  if (DEMO) return demoState();
  const r = await fetch("/api/state", {cache: "no-store"});
  return r.json();
}
async function post(p, b) {
  lastTouch = Date.now();
  let j;
  if (DEMO) j = await demoPost(p, b || {});
  else {
    const r = await fetch(p, {method: "POST", headers: {"Content-Type": "application/json", "X-GK-CSRF": "1"}, body: JSON.stringify(b || {})});
    j = await r.json().catch(() => ({ok: false, msg: "応答を読めませんでした"}));
    if (r.status === 401 && p !== "/api/login") j._401 = true;
  }
  if (j._401) { authed = false; go("dash"); toast(j.msg || "ロックされました"); }
  return j;
}

/* ---------- 画面キーボード ---------- */
let kbShift = false, kbSym = false, kbInput = null;
const ROWS = [["1","2","3","4","5","6","7","8","9","0"], ["q","w","e","r","t","y","u","i","o","p"], ["a","s","d","f","g","h","j","k","l","-"], ["z","x","c","v","b","n","m",".","_","@"]];
const SYM = [["!","%","&","(",")","*","+",",","/",":"], [";","<","=",">","?","[","]","^","{","}"], ["|","~","-","_",".","@","1","2","3","4"], ["5","6","7","8","9","0"]];
function drawKb() {
  const rows = kbSym ? SYM : ROWS;
  $("#kb").innerHTML = rows.map(r => '<div class="r">' + r.map(k => { const c = kbShift && !kbSym ? k.toUpperCase() : k; return '<button data-k="' + esc(c) + '">' + esc(c) + '</button>'; }).join("") + "</div>").join("") +
    '<div class="r"><button class="w" data-a="shift">' + (kbShift ? "ABC" : "abc") + '</button><button class="w" data-a="sym">' + (kbSym ? "英字" : "記号") + '</button><button class="w" data-a="show">表示</button><button class="w" data-a="bs">⌫</button><button class="w" data-a="next">次の欄</button><button class="w" data-a="close">閉じる</button><button class="w go" data-a="enter">決定</button></div>';
}
$("#kb").addEventListener("mousedown", e => e.preventDefault());
$("#kb").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !kbInput) return; lastTouch = Date.now();
  if (b.dataset.k) { kbInput.value += b.dataset.k; kbInput.dispatchEvent(new Event("input")); }
  const a = b.dataset.a;
  if (a === "bs") { kbInput.value = kbInput.value.slice(0, -1); kbInput.dispatchEvent(new Event("input")); }
  if (a === "shift") { kbShift = !kbShift; drawKb(); }
  if (a === "sym") { kbSym = !kbSym; drawKb(); }
  if (a === "show" && kbInput.dataset.pw) { kbInput.type = kbInput.type === "password" ? "text" : "password"; }
  if (a === "close") { hideKb(); }
  if (a === "next") { const all = [...document.querySelectorAll("#main input")], i = all.indexOf(kbInput); if (all[i + 1]) all[i + 1].focus(); else hideKb(); }
  if (a === "enter") { const p = document.querySelector("#main button.pri"); hideKb(); if (p) p.click(); }
});
document.addEventListener("focusin", e => { if (e.target.tagName === "INPUT") { kbInput = e.target; drawKb(); $("#kb").style.display = "block"; setTimeout(() => e.target.scrollIntoView({block: "center"}), 50); } });
function hideKb() { $("#kb").style.display = "none"; kbInput = null; if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur(); }

/* ---------- 部品 ---------- */
const IC = {
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  net: '<rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/>',
  test: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  power: '<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  wand: '<path d="M4 20L16 8M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 11l.7 1.3 1.3.7-1.3.7-.7 1.3-.7-1.3-1.3-.7 1.3-.7z"/>'};
const icon = k => '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[k] + "</svg>";
const sw = (name, on) => '<button class="sw ' + (on ? "on" : "") + '" role="switch" aria-checked="' + !!on + '" data-sw="' + name + '"></button>';
const pill = (cls, t) => '<span class="pill ' + cls + '">' + esc(t) + "</span>";
function msg(id) { const f = flash[id]; return '<div class="msg ' + (f ? (f[1] ? "g" : "e") : "") + '" id="m_' + id + '">' + (f ? esc(f[0]) : "") + "</div>"; }
function setMsg(id, t, good) { flash[id] = [t, good]; const el = $("#m_" + id); if (el) { el.textContent = t; el.className = "msg " + (good ? "g" : "e"); } }
function toast(t) { flash.dash = [t, false]; render(); }
function confirmDlg(h, s, yes, act) { dlg = {h, s, yes, act}; drawOverlay(); }

/* ---------- 画面 ---------- */
const TITLES = {dash: "ダッシュボード", login: "パスワード", forgot: "パスワードを忘れたとき", change: "新しいパスワード", home: "設定", wifi: "Wi-Fi", wifipw: "Wi-Fi に接続", guard: "守りのスイッチ",
  block: "遮断の解除", mail: "メール通知", pw: "パスワード", net: "ネットワーク", test: "自己試験", sys: "時刻・再起動", wizard: "初期設定"};
const V = {};
V.dash = () => {
  if (!S) return '<div class="narrow">読み込んでいます…</div>';
  const lv = S.level || "ng", c = S.counts || {}, sv = S.services || {}, n = S.net || {};
  const st = (ok, t1, t2) => pill(ok ? "ok" : "ng", ok ? t1 : t2);
  return msg("dash") + '<div class="band ' + lv + '"><div><div class="h">' + esc(S.headline) + '</div><div class="m">' +
    esc((S.messages || []).join(" ・ ") || ("最終確認 " + (S.checked || "-") + " ・ 整合性チェック " + (S.integrity || "-"))) + "</div></div></div>" +
    '<div class="grid"><div class="met"><div class="l">今日のアクセス</div><div class="v">' + (c.requests ?? "-") + '</div></div>' +
    '<div class="met"><div class="l">今日 拒否した数</div><div class="v">' + (c.denied ?? "-") + '</div></div>' +
    '<div class="met"><div class="l">いま遮断中の IP</div><div class="v">' + (c.blocked_now ?? "-") + '</div></div>' +
    '<div class="met"><div class="l">個人情報ガード（今日）</div><div class="v">' + (c.pii_today ?? "-") + "</div></div></div>" +
    '<div class="two"><div><div class="sec">部品</div>' +
    '<div class="row">入口（nginx）' + st(sv.nginx, "動作中", "停止") + "</div>" +
    '<div class="row">防火壁（nftables）' + st(sv.nftables, "動作中", "停止") + "</div>" +
    '<div class="row">個人情報ガード' + (S.switches && !S.switches.pii ? pill("wn", "OFF") : st(sv.piiguard, S.switches && S.switches.monitor_only ? "記録のみ" : "ON", "停止")) + "</div>" +
    '<div class="row">サーバー役PC' + st(S.backend && S.backend.ok, "応答あり", "応答なし") + "</div>" +
    '<div class="row">DLP（伏せ字）' + pill("ac", (c.dlp_rules ?? 0) + " 種類 有効") + "</div></div>" +
    '<div><div class="sec">最近のできごと</div>' + ((S.events || []).length ? S.events.map(e => '<div class="row"><span>' + esc(e.time) + " " + esc(e.text) + (e.ip ? " <small>" + esc(e.ip) + "</small>" : "") + "</span>" + pill(e.kind === "monitor" ? "ac" : "wn", e.kind === "monitor" ? "記録" : "対応") + "</div>").join("") : '<div class="row"><small>ありません</small></div>') +
    '<div class="sec" style="margin-top:.5rem">' + esc((n.ssid ? "Wi-Fi: " + n.ssid + " ・ " : "") + "外側 " + (n.ext_ip || "-") + " ・ 内側 " + (n.int_ip || "-") + " ・ " + (S.version || "")) + "</div></div></div>";
};
V.login = () => '<div class="narrow" style="text-align:center;margin-top:1rem"><div style="font-size:1.15rem;font-weight:600">' +
  (mustChange ? "初期パスワードを入力" : "設定を開くにはパスワードを入力") + '</div><div class="sec">' + (DEMO ? "見本なので何を入れても進みます" : "管理画面と同じパスワードです") + "</div>" +
  '<input type="password" id="pw" data-pw="1" inputmode="none" autocomplete="off">' + msg("login") +
