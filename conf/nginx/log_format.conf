log_format ai_watch escape=json
  '{"time":"$time_local",'
  '"remote_addr":"$remote_addr",'
  '"request":"$request",'
  '"request_uri":"$request_uri",'
  '"args":"$args",'
  '"status":"$status",'
  '"body_bytes":"$body_bytes_sent",'
  '"ua":"$http_user_agent",'
  '"request_time":"$request_time"}';
