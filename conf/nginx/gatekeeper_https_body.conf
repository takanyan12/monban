# micro-monban: 443番の共通本体（WAF・DLP・中継）
#  既定の server（sites-available/gatekeeper）と公開ドメイン用 server（gatekeeper-public）が include する。
#  WAF・DLP・中継の設定を直すときは、このファイルを編集する。

    include /etc/nginx/snippets/gatekeeper_deny.conf;   # 自動遮断中の IP（ダッシュボードが同期）

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GK_TLS:5m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 入口検査：簡易WAF（シグネチャ門前払い）
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|dirbuster|acunetix|masscan)) {
        return 403 "Blocked by Gatekeeper WAF: Malicious scanner detected.\n";
    }
    # [v1.13.1] パストラバーサル: 「.」2つ（%2e・二重符号化 %252e も）＋区切り（/ \ %2f %5c・二重符号化も）。
    #  nginx は引用符内の \\ を \ に読み替えるので、\ は \x5c と書く（以前の書き方は %2e%2e と ..\ を検出できていなかった）
    if ($request_uri ~* "(?:\.|%2e|%252e){2}(?:/|\x5c|%2f|%5c|%252f|%255c)") {
        return 403 "Blocked by Gatekeeper WAF: Path traversal detected.\n";
    }
    # SQL インジェクション: 単語の間は空白・+・%20 等・SQL コメントだけを許し、
    # order by は直後が数字のときだけ一致（普通の文章を誤って止めない）。sleep( / benchmark( は %28 も検出
    if ($args ~* "(union(?:\+|%20|%09|%0a|%0d|%0b|%0c|/\*.*?\*/|%2f%2a.*?%2a%2f|\s)+(?:all(?:\+|%20|%09|%0a|%0d|%0b|%0c|/\*.*?\*/|%2f%2a.*?%2a%2f|\s)+)?select|information_schema|order(?:\+|%20|%09|%0a|%0d|%0b|%0c|/\*.*?\*/|%2f%2a.*?%2a%2f|\s)+by(?:\+|%20|%09|%0a|%0d|%0b|%0c|/\*.*?\*/|%2f%2a.*?%2a%2f|\s)+[0-9]+\b|waitfor(?:\+|%20|%09|%0a|%0d|%0b|%0c|/\*.*?\*/|%2f%2a.*?%2a%2f|\s)+delay|benchmark(?:\s|\+|%20|%09)*(?:\(|%28)|sleep(?:\s|\+|%20|%09)*(?:\(|%28))") {
        return 403 "Blocked by Gatekeeper WAF: SQL injection pattern detected.\n";
    }

    # [v1.14.1] 隠しファイルの探り（/.env・/.git/config・/.htaccess など）は奥のサーバーへ渡さず 404。
    #  公開直後から自動巡回が探しに来るため。/.well-known/（証明書や各種の確認用）は除く
    location ~ "/\.(?!well-known/)" {
        return 404 "Blocked by Gatekeeper WAF: Hidden file.\n";
    }

    # バックエンド中継 & 出口検査：DLP（機密データ置換）＋ 個人情報 一括持ち出しガード
    location / {
        proxy_pass http://$gk_upstream;   # 通常は 127.0.0.1:8081（個人情報ガード）経由
        proxy_hide_header X-Powered-By;   # バックエンドの版数を外へ出さない

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request Smuggling 対策: 中継の HTTP 解釈を 1.1 に固定しつつ WebSocket/SSE も通す
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 平文化（インライン検閲用）
        proxy_set_header Accept-Encoding "";

        # 機密情報のリアルタイムマスキング（irg = 行内の全マッチを置換）
        # ルールはダッシュボードで管理（dlp_rules.json → 自動生成スニペット）
        subs_filter_types text/plain application/json text/csv text/xml application/xml text/javascript application/javascript application/x-javascript application/ld+json application/problem+json;
        include /etc/nginx/snippets/gatekeeper_dlp.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
